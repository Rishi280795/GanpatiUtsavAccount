name: Build Ganpati Utsav APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -o GanpatiUtsavAccounts-GitHub.zip -d extracted
          rsync -a extracted/ ./

      - name: Fix Java 17 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          old = '''android {
              namespace = "com.ganpati.utsav"
              compileSdk = 35
          '''

          new = '''android {
              namespace = "com.ganpati.utsav"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          '''

          if old not in text:
              raise SystemExit("Could not find expected android block")

          p.write_text(text.replace(old, new))
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GanpatiUtsavAccounts-APK
          path: app/build/outputs/apk/debug/app-debug.apk
